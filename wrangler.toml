name = "apps-dashboard"
main = "src/worker/index.ts"
compatibility_date = "2026-09-17"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

# Fires at both 7am and 8am UTC on Sundays (Cloudflare's cron parser
# rejects a wildcard hour paired with a restricted weekday, so this
# uses two fixed hours instead of "0 * * * 0"). The worker only
# actually sends when the current Europe/London time is 8am, so
# whichever of these lands on local 8am - 7am UTC in BST (summer),
# 8am UTC in GMT (winter) - is the one that fires, without needing a
# manual edit across the clock change.
[triggers]
crons = ["0 7 * * 0", "0 8 * * 0"]

[vars]
SUPABASE_URL = "https://rmooksnngqyzqraeicvr.supabase.co"
