name = "apps-dashboard"
main = "src/worker/index.ts"
compatibility_date = "2026-09-17"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

# Cron Trigger is NOT declared here. Wrangler's deploy-time API call to
# set it was failing with "invalid cron string" for every syntax tried
# (including Cloudflare's own documented example pattern), which was
# failing the whole deploy and blocking every other change from going
# live. Set the schedule instead via Cloudflare dashboard -> apps-dashboard
# Worker -> Triggers tab -> Cron Triggers -> Add. Two entries, 0 7 * * 0
# and 0 8 * * 0 (UTC), same DST-safe reasoning as before - the worker's
# scheduled() handler only actually sends when the current Europe/London
# time is 8am, so whichever entry lands on local 8am is the one that fires.

